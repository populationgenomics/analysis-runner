repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: '\.*conda/.*'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/populationgenomics/pre-commits
    rev: "8831b523138e0f620e3364ab8a82a05fb7c622d2"
    hooks:
      - id: cpg-id-checker


  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      - id: ruff
        # Temporary until the SET-1223 restructure PR: ruff 0.16 stabilised rules that flag package files we must keep byte-identical in this PR.
        exclude: ^analysis_runner/
      - id: ruff-format


  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args:
          [
            --pretty,
            --show-error-codes,
            --no-strict-optional,
            --ignore-missing-imports,
            --install-types,
            --non-interactive,
          ]
        additional_dependencies:
          [
            types-oauthlib,
            types-protobuf,
            types-PyYAML,
            types-requests,
            types-toml,
          ]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
