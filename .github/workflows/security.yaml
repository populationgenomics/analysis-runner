name: Security Checks

on:
  workflow_dispatch:
  push:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - analysis-runner
          - server
          - web
          - metamist-consumer
    name: Pip Audit (${{ matrix.package }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        working-directory: packages/${{ matrix.package }}
        # uv venvs don't include pip, but the pip-audit action drives the venv
        # via `python -m pip`; --seed preinstalls pip so the audit can run.
        run: |
          uv venv --seed
          uv sync --frozen

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: packages/${{ matrix.package }}/.venv
          summary: true
