name: Security Checks

on:
  workflow_dispatch:
  push:

jobs:
  pip-audit-package:
    runs-on: ubuntu-latest
    name: Pip Audit (Package)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: setup.py
      - name: Install from setup.py
       # match setuptools version in package workflow
        run: |
          pip install --upgrade 'setuptools>=69.3.0'
          pip install .

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          summary: true


  pip-audit-dev:
    runs-on: ubuntu-latest
    name: Pip Audit (Dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-dev.txt
          summary: true

  pip-audit-web:
    runs-on: ubuntu-latest
    name: Pip Audit (Web)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: web/requirements.txt
          summary: true

  pip-audit-server:
    runs-on: ubuntu-latest
    name: Pip Audit (Server)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: server/requirements.txt
          summary: true
