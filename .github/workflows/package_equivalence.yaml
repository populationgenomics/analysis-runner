name: Package equivalence
on: pull_request

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install build
        run: pip install build

      - name: Compare package built from base vs head
        run: |
          python .github/scripts/check_package_equivalence.py \
            "origin/${{ github.base_ref }}" HEAD
