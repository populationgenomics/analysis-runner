name: Deploy analysis-runner server
on:
  workflow_dispatch:
    inputs:
      hail_ref:
        description: 'Hail repo ref (or commit SHA)'
        required: true
        default: "main"
      deploy_to_prod:
        description: 'Deploy to production ?'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

env:
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
  CLOUDSDK_CORE_DISABLE_PROMPTS: 1
  REGION: australia-southeast1
  DRIVER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner/images/driver
  SERVER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner/images/server

  DEV_DRIVER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner-dev/images/driver
  DEV_SERVER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner-dev/images/server

jobs:
  deploy-common-dev:
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: pulumi-development
      cancel-in-progress: false

    steps:
    - name: "checkout analysis-runner repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "checkout analysis-runner-private (stack config)"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: populationgenomics/analysis-runner-private
        ref: main
        path: analysis-runner-private
        token: ${{ secrets.ANALYSIS_RUNNER_PRIVATE_TOKEN }}
        persist-credentials: false

    - name: "copy Pulumi stack config"
      run: |
        cp analysis-runner-private/infrastructure/common/Pulumi.common-development.yaml infrastructure/

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (development)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/PLACEHOLDER_DEV_PROJECT_NUMBER/locations/global/workloadIdentityPools/PLACEHOLDER_POOL/providers/PLACEHOLDER_PROVIDER"
        service_account: "PLACEHOLDER-deploy@analysis-runner-dev.iam.gserviceaccount.com"

    - name: "Install uv"
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    # Shared resources.
    - name: "pulumi up (common-development)"
      uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
      with:
        command: up
        work-dir: ./infrastructure
        stack-name: common-development
        cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        PULUMI_SKIP_CHECKPOINTS: true

  build:
    needs: deploy-common-dev
    runs-on: ubuntu-latest
    environment: development
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
    - name: "checkout analysis-runner repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "checkout Hail repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: "populationgenomics/hail"
        ref: ${{ github.event.inputs.hail_ref }}
        path: "hail"

    - name: "Determine Hail SHA"
      run: |
        cd hail
        echo "HAIL_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: "Set Docker image tag"
      id: tag
      run: |
        echo "IMAGE_TAG=${{ github.sha }}-hail-$HAIL_SHA" >> $GITHUB_ENV
        echo "image_tag=${{ github.sha }}-hail-$HAIL_SHA" >> $GITHUB_OUTPUT

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (development)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/PLACEHOLDER_DEV_PROJECT_NUMBER/locations/global/workloadIdentityPools/PLACEHOLDER_POOL/providers/PLACEHOLDER_PROVIDER"
        service_account: "PLACEHOLDER-deploy@analysis-runner-dev.iam.gserviceaccount.com"

    - id: "google-cloud-sdk-setup"
      name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: "gcloud docker auth"
      run: |
        gcloud auth configure-docker marketplace.gcr.io,australia-southeast1-docker.pkg.dev

    - name: "build driver image"
      run: |
        docker build \
          -f driver/Dockerfile.hail \
          --build-arg HAIL_SHA=$HAIL_SHA \
          --tag $DEV_DRIVER_IMAGE:latest \
          --tag $DEV_DRIVER_IMAGE:$IMAGE_TAG \
          driver

    - name: "push driver image"
      run: |
        docker push $DEV_DRIVER_IMAGE:$IMAGE_TAG
        docker push $DEV_DRIVER_IMAGE:latest

    - name: "build server image"
      run: |
        docker build \
          --build-arg DRIVER_IMAGE=$DEV_DRIVER_IMAGE:latest \
          --tag $DEV_SERVER_IMAGE:latest \
          --tag $DEV_SERVER_IMAGE:$IMAGE_TAG \
          packages/server

    - name: "push server image"
      run: |
        docker push $DEV_SERVER_IMAGE:$IMAGE_TAG
        docker push $DEV_SERVER_IMAGE:latest

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: pulumi-development
      cancel-in-progress: false

    steps:
    - name: "checkout analysis-runner repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "checkout analysis-runner-private (stack config)"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: populationgenomics/analysis-runner-private
        ref: main
        path: analysis-runner-private
        token: ${{ secrets.ANALYSIS_RUNNER_PRIVATE_TOKEN }}
        persist-credentials: false

    - name: "copy Pulumi stack config"
      run: |
        cp analysis-runner-private/infrastructure/server/Pulumi.server-development.yaml infrastructure/

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (development)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/PLACEHOLDER_DEV_PROJECT_NUMBER/locations/global/workloadIdentityPools/PLACEHOLDER_POOL/providers/PLACEHOLDER_PROVIDER"
        service_account: "PLACEHOLDER-deploy@analysis-runner-dev.iam.gserviceaccount.com"

    - name: "Install uv"
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: "pulumi up (server-development)"
      uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
      with:
        command: up
        work-dir: ./infrastructure
        stack-name: server-development
        cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
        config-map: "{'analysis-runner:server_image_tag': {value: '${{ needs.build.outputs.image_tag }}', secret: false}}"
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        PULUMI_SKIP_CHECKPOINTS: true

  smoke-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: development

    steps:
    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (development)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/PLACEHOLDER_DEV_PROJECT_NUMBER/locations/global/workloadIdentityPools/PLACEHOLDER_POOL/providers/PLACEHOLDER_PROVIDER"
        service_account: "PLACEHOLDER-deploy@analysis-runner-dev.iam.gserviceaccount.com"

    - id: "google-cloud-sdk-setup"
      name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: "submit test batch"
      run: |
        URL=$(gcloud run services describe server-dev --region australia-southeast1 --platform managed --format "value(status.url)")
        TOKEN=$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.SMOKE_TEST_SA }}" --audiences="$URL" --include-email)

        req_obj='{"output": "ci-test-batch/v42", "dataset": "fewgenomes", "accessLevel": "test", "repo": "analysis-runner", "commit": "${{ github.sha }}", "cwd": "packages/analysis-runner/tests", "script": ["./main.py"], "description": "analysis-runner-test", "wait": true}'

        # sometimes the container takes about 3-4 minutes to load the first time
        # this causes a timeout because we're waiting, so we retry a few times
        exit_status=0
        for i in {1..3}; do
            curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type:application/json" \
                -d "$req_obj" \
                $URL && break || { exit_status=$?; sleep 5; }

            if [ $i -eq 3 ]; then
                echo "Failed to submit test batch"
                exit $exit_status
            fi

            echo "Retrying due to curl exit status: $exit_status ..."

        done

  deploy-prod:
    needs: [build, smoke-test]
    if: ${{ inputs.deploy_to_prod }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pulumi-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
    - name: "checkout analysis-runner repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "checkout analysis-runner-private (stack config)"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: populationgenomics/analysis-runner-private
        ref: main
        path: analysis-runner-private
        token: ${{ secrets.ANALYSIS_RUNNER_PRIVATE_TOKEN }}
        persist-credentials: false

    - name: "copy Pulumi stack config"
      run: |
        cp analysis-runner-private/infrastructure/common/Pulumi.common-production.yaml infrastructure/
        cp analysis-runner-private/infrastructure/server/Pulumi.server-production.yaml infrastructure/

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (production)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/370374240567/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "server-deploy@analysis-runner.iam.gserviceaccount.com"

    - id: "google-cloud-sdk-setup"
      name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: "gcloud docker auth"
      run: |
        gcloud auth configure-docker australia-southeast1-docker.pkg.dev

    - name: "Install uv"
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: "pulumi up (common-production)"
      uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
      with:
        command: up
        work-dir: ./infrastructure
        stack-name: common-production
        cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        PULUMI_SKIP_CHECKPOINTS: true

    # Copies the same images that passed the dev smoke test into the production registry.
    - name: "promote driver image"
      run: |
        docker buildx imagetools create \
          --tag $DRIVER_IMAGE:$IMAGE_TAG \
          --tag $DRIVER_IMAGE:latest \
          $DEV_DRIVER_IMAGE:$IMAGE_TAG

    - name: "promote server image"
      run: |
        docker buildx imagetools create \
          --tag $SERVER_IMAGE:$IMAGE_TAG \
          --tag $SERVER_IMAGE:latest \
          $DEV_SERVER_IMAGE:$IMAGE_TAG

    - name: "pulumi up (server-production)"
      uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
      with:
        command: up
        work-dir: ./infrastructure
        stack-name: server-production
        cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
        config-map: "{'analysis-runner:server_image_tag': {value: '${{ needs.build.outputs.image_tag }}', secret: false}}"
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        PULUMI_SKIP_CHECKPOINTS: true
