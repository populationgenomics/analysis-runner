name: SBOM Upload

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - analysis-runner
          - server
          - web
          - metamist-consumer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Get project name and version
        id: project
        working-directory: packages/${{ matrix.package }}
        run: |
          echo "name=$(uv version | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "version=$(uv version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        working-directory: packages/${{ matrix.package }}
        run: |
          uv sync --frozen --no-dev
          uvx --from cyclonedx-bom cyclonedx-py environment \
              --pyproject pyproject.toml \
              --mc-type application \
              -o sbom.cdx.json \
              .venv/bin/python

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/379228030003/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'dtrack-ci@devops-tools-433123.iam.gserviceaccount.com'
          token_format: 'id_token'
          id_token_audience: '379228030003-nug7attglk5fht4gmp6v8s2b88epnmsq.apps.googleusercontent.com'
          id_token_include_email: true

      - name: Upload SBOM to Dependency-Track
        working-directory: packages/${{ matrix.package }}
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          PROJECT_NAME: ${{ steps.project.outputs.name }}
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        run: |
            # Stream the SBOM through a file + --rawfile to avoid the
            # ARG_MAX limit hit when passing it inline via --arg.
            base64 -w0 sbom.cdx.json > sbom.b64
            jq -n \
              --arg name "$PROJECT_NAME" \
              --arg version "$PROJECT_VERSION" \
              --rawfile bom sbom.b64 \
              --arg ref "$GITHUB_REF_NAME" \
              '{
                projectName: $name,
                projectVersion: $version,
                autoCreate: true,
                bom: $bom,
                projectTags: [
                  {name: "python"},
                  {name: $ref}
                ]
              }' | \
            curl -sf -X PUT "https://dtrack.popgen.rocks/api/v1/bom" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Api-Key: $DTRACK_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
