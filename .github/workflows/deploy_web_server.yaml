name: Deploy web server
on:
  workflow_dispatch:
    inputs:
      deploy_to_prod:
        description: 'Deploy to production ?'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

env:
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
  CLOUDSDK_CORE_DISABLE_PROMPTS: 1
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner/images/web
  DEV_DOCKER_IMAGE: australia-southeast1-docker.pkg.dev/analysis-runner-dev/images/web

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: "checkout repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (development)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/PLACEHOLDER_DEV_PROJECT_NUMBER/locations/global/workloadIdentityPools/PLACEHOLDER_POOL/providers/PLACEHOLDER_PROVIDER"
        service_account: "PLACEHOLDER-deploy@analysis-runner-dev.iam.gserviceaccount.com"

    - id: "google-cloud-sdk-setup"
      name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: "gcloud docker auth"
      run: |
        gcloud auth configure-docker australia-southeast1-docker.pkg.dev

    - name: "build image"
      run: |
        docker build --tag $DEV_DOCKER_IMAGE:$IMAGE_TAG packages/web

    - name: "push image"
      run: |
        docker push $DEV_DOCKER_IMAGE:$IMAGE_TAG

  deploy-prod:
    needs: build
    if: ${{ inputs.deploy_to_prod }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pulumi-production
      cancel-in-progress: false

    steps:
    - name: "checkout repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "checkout analysis-runner-private (stack config)"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: populationgenomics/analysis-runner-private
        ref: main
        path: analysis-runner-private
        token: ${{ secrets.ANALYSIS_RUNNER_PRIVATE_TOKEN }}
        persist-credentials: false

    - name: "copy Pulumi stack config"
      env:
        PULUMI_STACK_NAME: ${{ vars.PULUMI_STACK_NAME }}
      run: |
        cp "analysis-runner-private/infrastructure/Pulumi.${PULUMI_STACK_NAME}.yaml" infrastructure/

    - id: "google-cloud-auth"
      name: "Authenticate to Google Cloud (production)"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/370374240567/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "server-deploy@analysis-runner.iam.gserviceaccount.com"

    - id: "google-cloud-sdk-setup"
      name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: "gcloud docker auth"
      run: |
        gcloud auth configure-docker australia-southeast1-docker.pkg.dev

    # Copies the image built above into the production registry.
    - name: "promote image to production registry"
      run: |
        docker buildx imagetools create \
          --tag $DOCKER_IMAGE:$IMAGE_TAG \
          $DEV_DOCKER_IMAGE:$IMAGE_TAG

    - name: "Install uv"
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: "pulumi up (production)"
      uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
      with:
        command: up
        work-dir: ./infrastructure
        stack-name: ${{ vars.PULUMI_STACK_NAME }}
        cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
        config-map: "{'analysis-runner:web_image_tag': {value: '${{ github.sha }}', secret: false}}"
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        PULUMI_SKIP_CHECKPOINTS: true
