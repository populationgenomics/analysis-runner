# Thin, non-package root project.
#
# This repo is a monorepo of INDEPENDENT uv projects living under `packages/`
# (the analysis-runner CLI plus the server/web/metamist-consumer services). It is
# deliberately NOT a uv workspace: each package has its own pyproject.toml, its own
# uv.lock and its own virtual environment, and commands are run from within the
# relevant package directory (so `uv run --package` is intentionally unavailable).
#
# This root project exists only to provide a repo-wide dev environment (linting,
# pre-commit) and to hold the shared ruff configuration that every package inherits.
[project]
name = "analysis-runner-repo"
version = "0"
requires-python = ">=3.10"

[tool.uv]
# Never build or install this root project itself; it only carries dev tooling.
package = false

[dependency-groups]
dev = [
    "ruff~=0.11",
    "pre-commit",
    "pylint",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"


[tool.ruff.lint]
# ignore pydocstyle, flake8-boolean-trap (FBT)
select = ["A", "B", "C",  "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

fixable = ["ALL"]

ignore = [
    "COM812",  # Missing trailing comma (formatter conflict)
    "ISC001",  # Implicit string concatenation (formatter conflict)
    "Q000",    # Handled by format.quote-style = "single"
    "Q003",    # Handled by format.quote-style = "single"
    "ANN101", "ANN201", "ANN401", "E501", "E731", "E741", "G004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLW0603", "PT018", "S101",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "hail", "cpg", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
hail = ["hail", "hailtop"]
cpg = ["cpg_flow", "cpg_utils", "cpg_infra", "metamist", "analysis_runner"]
# Adjust these for each repository, e.g., removing those that should be
# local rather than CPG. Also fill in extend_skip below if there are any
