[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-runner"
description = "Analysis runner to help make analysis results reproducible"
readme = "README.md"
license = "MIT"
keywords = ["bioinformatics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = [
    "cloudpathlib[all]",
    "cpg-utils>=5.0.0",
    # Avoid dependency resolution backtracking caused by hail pinning an
    # old version of protobuf and recent versions of grpcio-status requiring
    # a much newer version
    "grpcio-status>=1.48,<1.50",
    "hail>=0.2.134",
    "requests",
    "tabulate",
]

[project.optional-dependencies]
hail = [
    # Mirrors the hail pin in [project] dependencies — keep the two in sync.
    # Today hail is installed unconditionally; when Hail Batch is dropped,
    # remove hail from [project] dependencies and this extra becomes the
    # explicit opt-in, so consumers already depending on
    # analysis-runner[hail] see no change.
    "hail>=0.2.134",
]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
dev = [
    "analysis-runner[test]",
    "bump2version",
    "pre-commit",
    "pylint",
    "ruff~=0.15",
    "toml",
]

[project.urls]
Repository = "https://github.com/populationgenomics/analysis-runner"

[project.scripts]
analysis-runner = "analysis_runner.cli:main_from_args"

[dependency-groups]
# `base` mirrors [project] dependencies minus hail and minus the
# hail-motivated grpcio-status pin (both leave together when Hail Batch is
# dropped) — PEP 735 groups cannot reference [project] dependencies, so keep
# the lists in sync. It is the install target for hail-free images.
base = [
    "cloudpathlib[all]",
    "cpg-utils>=5.0.0",
    "requests",
    "tabulate",
]
web = [
    { include-group = "base" },
    "cachetools~=5.3",
    "cryptography>=44.0.2", # floor to avoid vuln: GHSA-79v4-65xg-pq4g
    "flask~=3.1",
    "google-api-python-client~=2.113",
    "google-cloud-secret-manager~=2.17",
    "google-cloud-storage~=2.14",
    "gunicorn~=23.0",
]
# The server image builds FROM the Hail driver image, which supplies hail
# itself — hail's version is coupled to the deployed Hail Batch service, so
# it is deliberately not declared here. Everything else the server code
# imports is declared explicitly; the aiohttp/grpcio-status/protobuf bounds
# must stay compatible with the image's hail.
server = [
    { include-group = "base" },
    "aiohttp>=3.9,<4", # match hail's bound on the driver image
    "cachetools",
    "google-api-python-client",
    "google-auth",
    "google-cloud-appengine-logging",
    "google-cloud-audit-log",
    "google-cloud-logging",
    "google-cloud-pubsub",
    "google-cloud-secret-manager",
    "grpcio-status>=1.48,<1.50", # match hail's protobuf on the driver image
    "gunicorn",
    "nest-asyncio",
    "protobuf==3.20.2", # match hail's pin on the driver image
    "toml",
]
# Cloud Function (--runtime python311); kept minimal, so no base include.
metamist = [
    "google-cloud-logging",
    "requests",
]

[tool.setuptools]
packages = ["analysis_runner"]

[tool.setuptools.dynamic]
version = { attr = "analysis_runner._version.__version__" }

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"


[tool.ruff.lint]
# ignore pydocstyle, flake8-boolean-trap (FBT)
select = ["A", "B", "C",  "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

fixable = ["ALL"]

ignore = [
    "COM812",  # Missing trailing comma (formatter conflict)
    "ISC001",  # Implicit string concatenation (formatter conflict)
    "Q000",    # Handled by format.quote-style = "single"
    "Q003",    # Handled by format.quote-style = "single"
    "ANN101", "ANN201", "ANN401", "E501", "E731", "E741", "G004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLW0603", "PT018", "S101",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "hail", "cpg", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
hail = ["hail", "hailtop"]
cpg = ["cpg_flow", "cpg_utils", "cpg_infra", "metamist", "analysis_runner"]
